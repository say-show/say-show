<!DOCTYPE html>

  <link rel="stylesheet" href="style.css">
  <style>
    /* --- HERO DEMO STYLES (v2) --- */
    .hero.demo-hero {
      position: relative;
      overflow: hidden;
      min-height: 80vh;
      background: #05060b; /* フォールバック */
    }

    .hero.demo-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('images/a-single-star-and-a-speaker.png') center/cover;
      filter: blur(20px) brightness(0.4);
      z-index: 1;
      animation: slow-pan 30s linear infinite alternate;
      transform: scale(1.1); /* 初期状態を少し拡大 */
    }

    @keyframes slow-pan {
      from {
        transform: scale(1.1) rotate(-1deg);
      }
      to {
        transform: scale(1.2) rotate(1deg);
      }
    }

    .hero.demo-hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAFVBMVEUBAQEtLS3l5eXAwMDa2tpiYmK3t7fGfGSoAAAAAXRSTlMAQObYZgAAAAlwSFlzAAAOxAAADsQBlSsOGwAAADxJREFUOI1jYBgFo2AUjIJRMApGwSigBwYGBgYGDQ0NDg4ODo5GRkZGRkYmJiYWFhYVlZWyMDIyMjLwAUYpBwAAbf4K561UvGgAAAAASUVORK5CYII=);
      opacity: 0.1;
      z-index: 2;
      pointer-events: none;
    }

    .hero.demo-hero .hero-inner {
      z-index: 3;
      position: relative;
    }

    /* Text animation is removed for this version */

  </style>
</head>
