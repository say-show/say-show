<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SAY-SHOW | Hero Demo - Bokeh Light</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    /* --- HERO DEMO: ボケ光（シネマティック） --- */
    .hero.demo-bokeh {
      position: relative;
      overflow: hidden;
      min-height: 80vh;
      background: linear-gradient(135deg, #0a0a12 0%, #0d1020 50%, #0a0812 100%);
    }

    /* ボケ光コンテナ */
    .bokeh-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    /* ボケ光の基本スタイル */
    .bokeh {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      animation: float-bokeh 8s ease-in-out infinite;
    }

    @keyframes float-bokeh {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      25% {
        transform: translate(40px, -50px) scale(1.15);
      }
      50% {
        transform: translate(-30px, 40px) scale(0.85);
      }
      75% {
        transform: translate(-50px, -20px) scale(1.1);
      }
    }

    /* 各ボケ光の設定 - ピンク系 */
    .bokeh.pink-1 {
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 75, 139, 0.25) 0%, transparent 70%);
      top: 10%;
      left: 15%;
      animation-delay: 0s;
      animation-duration: 7s;
    }
    .bokeh.pink-2 {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(255, 100, 150, 0.2) 0%, transparent 70%);
      top: 60%;
      right: 20%;
      animation-delay: -2s;
      animation-duration: 9s;
    }
    .bokeh.pink-3 {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(255, 75, 139, 0.3) 0%, transparent 70%);
      top: 35%;
      right: 10%;
      animation-delay: -4s;
      animation-duration: 6s;
    }

    /* オレンジ/暖色系 */
    .bokeh.orange-1 {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255, 140, 66, 0.2) 0%, transparent 70%);
      top: 25%;
      right: 25%;
      animation-delay: -1s;
      animation-duration: 10s;
    }
    .bokeh.orange-2 {
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(255, 180, 100, 0.25) 0%, transparent 70%);
      bottom: 20%;
      left: 10%;
      animation-delay: -3s;
      animation-duration: 8s;
    }

    /* 青系 */
    .bokeh.blue-1 {
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(100, 150, 255, 0.15) 0%, transparent 70%);
      top: 50%;
      left: 5%;
      animation-delay: -1.5s;
      animation-duration: 9s;
    }
    .bokeh.blue-2 {
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(80, 120, 200, 0.12) 0%, transparent 70%);
      bottom: 10%;
      right: 5%;
      animation-delay: -2.5s;
      animation-duration: 11s;
    }

    /* 紫系 */
    .bokeh.purple-1 {
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(150, 100, 200, 0.18) 0%, transparent 70%);
      top: 5%;
      right: 35%;
      animation-delay: -1.8s;
      animation-duration: 8s;
    }
    .bokeh.purple-2 {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, rgba(180, 120, 220, 0.22) 0%, transparent 70%);
      bottom: 30%;
      left: 30%;
      animation-delay: -2.2s;
      animation-duration: 7s;
    }

    /* 小さな光点 */
    .bokeh.tiny-1 {
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
      top: 20%;
      left: 40%;
      animation-delay: -0.5s;
      animation-duration: 5s;
    }
    .bokeh.tiny-2 {
      width: 30px;
      height: 30px;
      background: radial-gradient(circle, rgba(255, 200, 150, 0.35) 0%, transparent 70%);
      top: 70%;
      left: 60%;
      animation-delay: -3.5s;
      animation-duration: 6s;
    }
    .bokeh.tiny-3 {
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, rgba(255, 75, 139, 0.28) 0%, transparent 70%);
      top: 45%;
      right: 40%;
      animation-delay: -4.5s;
      animation-duration: 7s;
    }

    /* 微妙なグラデーションオーバーレイ */
    .hero.demo-bokeh::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(5, 6, 11, 0.5) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .hero.demo-bokeh .hero-inner {
      z-index: 10;
      position: relative;
    }

    /* タイトルに微妙なグロー */
    .hero.demo-bokeh h1 {
      text-shadow: 0 0 60px rgba(255, 75, 139, 0.2);
    }
  </style>
</head>
