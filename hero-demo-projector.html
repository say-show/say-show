  <style>
    /* --- HERO DEMO: 映写機の光芒 --- */
    .hero.demo-projector {
      position: relative;
      overflow: hidden;
      min-height: 80vh;
      background: #05060b;
    }

    /* 映写機の光（上から広がる三角形） */
    .hero.demo-projector::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 50vw solid transparent;
      border-right: 50vw solid transparent;
      border-top: 120vh solid rgba(255, 200, 150, 0.08);
      z-index: 1;
      filter: blur(40px);
    }

    /* 光の中心（より明るい部分） */
    .projector-core {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 300px;
      background: radial-gradient(ellipse at top, rgba(255, 180, 120, 0.3), transparent 70%);
      z-index: 2;
      filter: blur(30px);
    }

    /* ダスト粒子 */
    .dust-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
    }

    .dust {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 220, 180, 0.6);
      border-radius: 50%;
      animation: float-dust 8s ease-in-out infinite;
    }

    @keyframes float-dust {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) translateX(20px);
        opacity: 0;
      }
    }

    /* 各ダスト粒子の位置とタイミング */
    .dust:nth-child(1) { left: 45%; top: 5%; animation-delay: 0s; animation-duration: 7s; }
    .dust:nth-child(2) { left: 52%; top: 8%; animation-delay: 1s; animation-duration: 9s; }
    .dust:nth-child(3) { left: 48%; top: 3%; animation-delay: 2s; animation-duration: 8s; }
    .dust:nth-child(4) { left: 55%; top: 10%; animation-delay: 0.5s; animation-duration: 10s; }
    .dust:nth-child(5) { left: 43%; top: 6%; animation-delay: 3s; animation-duration: 7.5s; }
    .dust:nth-child(6) { left: 50%; top: 4%; animation-delay: 1.5s; animation-duration: 8.5s; }
    .dust:nth-child(7) { left: 47%; top: 9%; animation-delay: 2.5s; animation-duration: 9.5s; }
    .dust:nth-child(8) { left: 53%; top: 2%; animation-delay: 0.8s; animation-duration: 7.2s; }
    .dust:nth-child(9) { left: 46%; top: 7%; animation-delay: 3.5s; animation-duration: 8.8s; }
    .dust:nth-child(10) { left: 51%; top: 5%; animation-delay: 1.2s; animation-duration: 9.2s; }
    .dust:nth-child(11) { left: 49%; top: 11%; animation-delay: 2.8s; animation-duration: 7.8s; }
    .dust:nth-child(12) { left: 54%; top: 4%; animation-delay: 0.3s; animation-duration: 8.3s; }

    /* 下部のグラデーション（フェードアウト） */
    .hero.demo-projector::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(to top, #05060b, transparent);
      z-index: 4;
      pointer-events: none;
    }

    .hero.demo-projector .hero-inner {
      z-index: 10;
      position: relative;
    }

    /* タイトルに光のグロー */
    .hero.demo-projector h1 {
      text-shadow: 0 0 40px rgba(255, 180, 120, 0.3);
    }
  </style>
</head>
